<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scope — Gap Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400;1,14..32,500&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="results.css">
<script>
(function(){
  var s = {};
  try { s = JSON.parse(localStorage.getItem('scopePrefs')||'{}'); } catch(e){}
  var r = document.documentElement;
  r.setAttribute('data-theme', s.theme || 'light');
  r.setAttribute('data-type', s.type || 'helvetica');
  r.setAttribute('data-density', s.density || 'comfortable');
  var ac={brick:'#8a2a1f',ink:'#15161a',forest:'#234f33',cobalt:'#1f3aa8',ochre:'#9a6b12'};
  var a = ac[s.accent]||ac.brick;
  if((s.theme||'light')==='dark'){var d={ink:'#efeee8',brick:'#d6584a',forest:'#5fae73',cobalt:'#6f8cff',ochre:'#d6a23c'};a=d[s.accent]||a;}
  r.style.setProperty('--accent', a);
})();
</script>
</head>
<body class="results-body">

<div class="shell">

  <!-- TOP BAR -->
  <div class="topbar no-print">
    <div class="topbar-left">
      <a href="index.html" class="topbar-brand"><span class="mark"></span>Scope</a>
    </div>
    <div class="topbar-right">
      <a href="index.html" class="topbar-link">← Edit answers</a>
      <button class="topbar-link" onclick="window.print()" style="border:0;background:none">Print / PDF</button>
    </div>
  </div>

  <!-- REPORT HEADER -->
  <header class="report-head">
    <div class="report-kicker">AI Governance Gap Report</div>
    <div class="report-head-grid">
      <div class="report-head-main">
        <h1 id="report-org">Your Organisation</h1>
        <div class="report-meta" id="report-meta"></div>
      </div>
      <div class="report-head-score">
        <div class="big-score" id="big-score">0.00<span class="denom"> / 4.0</span></div>
        <div class="big-tier" id="big-tier">—</div>
      </div>
    </div>
  </header>

  <!-- MATURITY LADDER -->
  <section class="ladder-section">
    <div class="ladder-rail">
      <div class="ladder-fill" id="ladder-fill"></div>
      <div class="ladder-marker" id="ladder-marker"><span id="ladder-marker-val">0.00</span></div>
    </div>
    <div class="ladder-stops" id="ladder-stops"></div>
  </section>

  <!-- TWO-UP: radar + signal -->
  <section class="overview-grid">
    <div class="radar-card">
      <div class="card-label">Dimension Profile</div>
      <canvas id="radar" width="460" height="460"></canvas>
    </div>
    <div class="signal-card">
      <div class="card-label">Governance Signal</div>
      <p class="signal-rec" id="signal-rec">—</p>
      <div class="signal-stats">
        <div class="signal-stat">
          <span class="signal-stat-val" id="stat-gaps">0</span>
          <span class="signal-stat-label">Gaps Detected</span>
        </div>
        <div class="signal-stat">
          <span class="signal-stat-val" id="stat-critical">0</span>
          <span class="signal-stat-label">Critical (A)</span>
        </div>
        <div class="signal-stat">
          <span class="signal-stat-val" id="stat-strong">0</span>
          <span class="signal-stat-label">Fully in place (D)</span>
        </div>
      </div>
    </div>
  </section>

  <!-- DIMENSION BARS -->
  <section class="bars-section">
    <div class="section-head-row">
      <div class="section-numeral">01</div>
      <h2 class="section-title">Scores by dimension</h2>
    </div>
    <div class="bars-list" id="bars-list"></div>
  </section>

  <!-- PRIORITY GAPS -->
  <section class="gaps-section">
    <div class="section-head-row">
      <div class="section-numeral">02</div>
      <h2 class="section-title">Priority gaps</h2>
    </div>
    <p class="gaps-intro" id="gaps-intro"></p>
    <div class="gaps-list" id="gaps-list"></div>
  </section>

  <!-- FULL BREAKDOWN -->
  <section class="breakdown-section">
    <div class="section-head-row">
      <div class="section-numeral">03</div>
      <h2 class="section-title">Full breakdown</h2>
    </div>
    <div id="breakdown"></div>
  </section>

  <footer class="footer">
    <span class="footer-left">Scope · AI Governance Diagnostic</span>
    <span class="footer-center" id="report-date">—</span>
    <span class="footer-right">Confidential</span>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="results.js"></script>
</body>
</html>
